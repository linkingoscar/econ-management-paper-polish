name: v3 validation

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository contract
        run: python scripts/validate_v3.py .
      - name: Validate skill package contract
        run: python scripts/validate_skill_package.py .
      - name: Run Skill Creator-compatible quick validation
        run: python -X utf8 scripts/quick_validate.py .
      - name: Validate reproducibility and adapter provenance lock
        run: python scripts/validate_repro_lock.py .
      - name: Run dependency-free smoke tests
        run: python evals/run_smoke_tests.py
      - name: Run expanded offline migration and adapter tests
        run: python evals/run_extended_tests.py
      - name: Run v3.1 writing foundation tests
        run: python evals/run_v31_writing_tests.py
      - name: Run offline pure-Agent benchmark and adversarial tests
        run: python evals/run_agentic_tests.py
      - name: Run writing gold and mutation benchmark
        run: python scripts/run_writing_benchmark.py --json
      - name: Run local dogfood workflow harness
        run: python scripts/run_dogfood_suite.py --json
      - name: Run portable platform and LaTeX capability smoke
        run: python scripts/run_platform_smoke.py --json
      - name: Run unified contract suite
        run: python scripts/run_contract_suite.py --json
